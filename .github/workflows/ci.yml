name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Chain 1: No services needed — fast feedback on lint, build, unit tests, schema validation
  no-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build --workspace=shared

      - name: Build infra
        run: npm run build --workspace=infra

      - name: Build api-contracts
        run: npm run build --workspace=api/contracts

      - name: Unit tests (api workspaces)
        run: npm test --workspace=api/contracts --workspace=api/planning --workspace=api/runtime --if-present

      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces

      - name: Lint all workspaces
        run: npm run lint

      - name: Build server
        run: npm run build --workspace=server

      - name: Build client (types only)
        run: npx tsc --noEmit
        working-directory: client

      - name: Build admin
        run: npm run build --workspace=admin

      - name: Unit tests (no DB/Redis needed)
        run: timeout 180 npm run test:unit --workspace=server

      - name: Schema-only content validation (no DB cross-references)
        run: npm run validate:schema --workspace=server

  with-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: postgresql://las_flores:las_flores_dev_password@localhost:5434/las_flores
      ANALYTICS_DATABASE_URL: postgresql://las_flores_analytics:las_flores_analytics_dev_password@localhost:5433/las_flores_analytics
      REDIS_URL: redis://localhost:6379
      RUNTIME_DATABASE_URL: postgresql://runtime:dev_runtime@localhost:5434/las_flores
      PLANNING_DATABASE_URL: postgresql://planning:dev_planning@localhost:5434/las_flores
      CI_NO_MINIO: '1'

    services:
      postgres-oltp:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: las_flores
          POSTGRES_USER: las_flores
          POSTGRES_PASSWORD: las_flores_dev_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-olap:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: las_flores_analytics
          POSTGRES_USER: las_flores_analytics
          POSTGRES_PASSWORD: las_flores_analytics_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build --workspace=shared

      - name: Build infra
        run: npm run build --workspace=infra

      - name: Build server
        run: npm run build --workspace=server

      - name: Apply database migrations (SQL only)
        run: npm run schema:migrate --workspace=server -- --schema-only

      - name: Integration tests
        run: timeout 300 npm run test:integration --workspace=server

      - name: Smoke tests (DB/Redis heartbeat)
        run: timeout 60 npm run test:smoke --workspace=server
