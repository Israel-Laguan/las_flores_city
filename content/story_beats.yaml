  - slug: act5_pjr_drifted_ending
    label: "Peter Jr. Ending — Drifted"
    order: 613
    description: "Player was absent at the rally; Peter Jr. moves on to a new circle, with the door left open."

  - slug: act5_pjr_distant_ending
