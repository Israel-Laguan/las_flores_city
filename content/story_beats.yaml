  - slug: pjr_act3_romantic_start
    label: "Peter Jr. Act 3 — Romantic Thread Begins"
    order: 605
    description: "The notebook exchange takes a romantic turn between the player and Peter Jr."

  - slug: pjr_act3_exploited
