name: Xue Lihua
title: Restaurateur, Former Operative
birth_year: 2000
description: A former Chinese military operative whose cover was a small restaurant in Old Las Flores. Abandoned by her handlers, she embraced her new identity and eventually married Kusi, her longtime regular customer.
physical_description: "A compact, wiry Chinese woman in her late 70s (born 2000) with silver-white hair (once black) in a practical bun and sharp, watchful dark brown eyes. She has a small scar on her left cheekbone, calloused hands and wears a plain cotton apron."
psychological_description: "Stern and protective, with an always-alert bearing carried over from her covert training."
