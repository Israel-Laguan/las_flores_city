description: Val is an 18-year-old university student from a small town near Río de las Flores. With dark hair in a loose ponytail and sun-kissed bronze skin from years outdoors, she's navigating the overwhelming transition to Central City. Despite feeling isolated by language barriers and cultural differences, she's determined to become a social worker to help others like her bridge two worlds.
physical_description: "An 18-year-old woman of medium height with dark hair in a loose ponytail, sun-kissed bronze skin and a solid build, in practical clothing. She has dark expressive eyes and a calm, determined expression."
psychological_description: "A determined and caring newcomer who feels isolated by language and cultural differences yet is resolved to bridge two worlds as a social worker."
