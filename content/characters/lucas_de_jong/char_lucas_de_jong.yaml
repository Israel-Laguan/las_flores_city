name: Lucas de Jong
title: Las Flores Resident
birth_year: 2053
description: 'Lucas de Jong is a 24-year-old Dutch man, raised in a well-to-do family that relocated to Las Flores for opportunities in the burgeoning lithium industry. He has a sleek, polished look: an angular face with a strong jaw, piercing blue eyes under thick dark brows, fair skin and glossy black hair swept up and back. He pays careful attention to his appearance, dressing in fashionable designer shirts, skinny jeans and elegant shoes, and keeps an athletic build through regular workouts at the gym.'
physical_description: 24-year-old Dutch man with an angular face, strong jawline, piercing blue eyes, stylishly cut dark hair and an athletic build; dresses in designer shirts, skinny jeans and elegant shoes.
psychological_description: "Image-conscious and cunning, a manipulator who carefully maintains an affluent lifestyle; wants a place at the center of Dutch society in Las Flores and fears his family's standing shrinking."
background_and_role:
  - Dutch resident raised in a well-to-do family relocated for the lithium industry
  - Regular gym-goer with a polished, fashionable image
  - "Part of the Dutch business community around Voss & Co. (GLC), Neptune's Haven and the Van der Meers"
  - "Fraternal twin of Levi de Jong (invented)"
  - "Not related to Lucas van der Meer or Lucas Morales; faction dutch_interest"
