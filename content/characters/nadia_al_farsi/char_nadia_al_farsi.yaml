id: 3ab2f6a9-8d14-41b1-b9cf-2b81d77a8459
name: Nadia Al-Farsi
title: Corporate Negotiator
birth_year: 2030
description: A high-level negotiator working alongside Yī Sāng to manage crises and control the public narrative during protests.
physical_description: "Middle Eastern woman in her mid-to-late 40s with an athletic-compact build, clear olive skin with fine lines at the corners of the eyes and deeper wrinkles on forehead, an oval face with a prominent jaw, slightly aquiline nose, deep-set dark brown eyes with subtle tiredness under thick well-defined arched brows, a faint vertical line between the brows and full natural lips, wavy dark hair styled back and a measured, appraising gaze, in polished corporate attire."
psychological_description: "Persuasive and composed, with sharp intellect and outwardly unwavering loyalty to her employers. Secretly investigating the mining companies' abuses while writing the narrative that covers them; afraid her own questions mark her as a risk."
background_and_role:
  - "Lawyer and negotiator for a Middle Eastern investment group partnered with LW Group"
  - "Works alongside Yī Sāng managing crises and the public narrative during protests"
  - "Fluent in Arabic, English and Spanish"
  - "At the 2059 Café de las Mañanas table with Yi Sang during the Student's Flight events"
  - "Secretly investigating illegal activity and human rights violations by some mining companies"
  - "Potential insider source; not part of the 2077 main plot"
