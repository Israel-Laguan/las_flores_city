name: Mei Lin
title: 22-year-old Business Student & Older Sister
description: "22-year-old business student and older sister to Lin Xiu. Non-idol features: broad-shouldered build, sun-tanned skin, strong angular asymmetrical jaw, and sharp swallow-tail eyebrows. Sleek black hair in a high ponytail. Favors modern, chic clothing incorporating Peranakan Nyonya batik prints. Exudes a confident, intimidating presence. Compensates for insecurities by trying to feel superior. Grew up working at the port. Shares a complex relationship with Lin Xiu: they adopt a shared arms-crossed tapping posture when defensive, and argue in Hokkien port slang to exclude others."
