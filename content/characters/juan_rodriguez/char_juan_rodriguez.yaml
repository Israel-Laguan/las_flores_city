name: Juan Rodríguez
title: Editor-in-Chief & Managing Director, El Informador de Las Flores
birth_year: 1999
description: |
  Juan Rodríguez, 78, is the legendary Editor-in-Chief and Managing Director of El Informador de Las Flores, the last independent newspaper in the city. Born into a family of indigenous activists in the rural outskirts of Las Flores, he studied journalism at the National University of Las Flores, specializing in community reporting, and spent his early career covering social issues and human rights abuses in marginalized communities. For nearly six decades he has exposed corruption, defended the marginalized and refused to let the truth be buried. Cynical about the world but hopeful about people, he mentors the next generation of reporters and wants to turn the paper into a cooperative before he retires.
physical_description: "Medium-height indigenous man with a solid, un-sculpted build, dark expressive eyes, a straight nose, a defined jaw and dark hair in simple un-styled shapes; calm, determined and composed, in minimalist practical clothing, with a small sport earbud clipped to his earlobe."
psychological_description: "Principled, stubborn and fiercely protective of his team; weary but unyielding dignity, dry dark humor, cynical about the world yet hopeful about people."
