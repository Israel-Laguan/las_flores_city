description: A 47-year-old customs officer at the busy port, Zhang Hao is a robust, self-serving man who leverages his position for bribes, favors, and control. Shrewdly manipulative and outwardly charming, he hides a deep insecurity behind a confident, imposing exterior. His cultural favoritism, harassment of female employees, and compulsive gambling define a man who uses corruption to maintain the power he fears losing.
physical_description: "A robust, medium-height Chinese man of 47 with a slightly graying crew cut and a rugged face. He wears a standard customs uniform with an old watch and several rings, and has a confident, calculating gaze."
psychological_description: "A shrewdly manipulative and outwardly charming man who hides deep insecurity behind an imposing exterior."
