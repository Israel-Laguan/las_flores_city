description: Driving force behind La Prensa's multimedia integration. Her digital media background was crucial in navigating the newspaper's transition to a multi-platform news organization.
physical_description: "A Latina woman in her early 40s with a square face, prominent jaw, almond eyes and a straight dark sharp bob. She has an athletic-compact build, a small silver stud in her left nostril and a sport earbud clipped to her earlobe, and dresses in modern editor attire with a tablet."
psychological_description: "A sharp, driven digital editor whose multimedia background shapes how she steers the newsroom. Pushes reach and speed to keep the paper solvent and independent, sometimes ahead of the facts."
