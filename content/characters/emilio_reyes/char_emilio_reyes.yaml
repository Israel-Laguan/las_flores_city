name: Emilio Reyes
title: Councilman / Judge, Andean District Court
birth_year: 2005
description: |
  Emilio Reyes was a councilman presiding over the Andean district court. He faced accusations of accepting bribes to suppress evidence in the Minera Estrella case.
physical_description: Latino man of 72 (born 2005; appeared younger in the trial-era flashbacks) of medium height, slightly overweight, with thinning, carefully combed dark brown hair, shifty dark brown eyes, a thin mustache and a gold watch; wears a cheap gray suit and sweats when questioned.
psychological_description: Nervous and corrupt; evasive under pressure, with a habit of adjusting his tie.
background_and_role:
  - Councilman presiding over the Andean district court
  - Accused of taking bribes to suppress evidence in the Minera Estrella case
  - Leaked correspondence hinted at a deal with an LW Group intermediary
