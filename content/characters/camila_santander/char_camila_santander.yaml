name: Camila Santander
title: Tourism Company Owner, Outdoor Adventure Guide
description: |
  Camila Santander is a 32-year-old tourism entrepreneur and outdoor adventure guide based in Las Flores. Her athletic build, sun-kissed skin, and long dark hair reflect her Hispanic heritage and active lifestyle. She runs a tourism company offering one-day and multi-day trips to the mountains, Agricultural Valley, river, and beach.

  While outwardly charismatic and exceptionally good at charming clients—a true Gemini—Camila is secretly misanthropic. She prefers the solitude of the mountains to human company and views her clients primarily as walking wallets. Her charming exterior is a carefully cultivated tool to maximize profit and fund her dream: building an exclusive, high-end rural lodge where she can be left alone.

  Her current major struggle is a fierce rivalry with a large-scale land developer planning to build a massive resort hotel right on top of her prime hiking trails. Her greed and hidden disdain for others often complicate her relationships, making genuine connections difficult.
