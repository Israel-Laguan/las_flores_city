physical_description: "Young Latina woman of 18 with slightly olive skin and brown curly hair in a ponytail; wears street clothes and a worn canvas jacket with vintage hero comics tucked inside."
psychological_description: "Idealistic daydreamer with a grounded belief in justice and community solidarity despite quiet exhaustion. Survivor guilt over her friend Camilo, and a fear of becoming less like him; she has tried violent vigilantism, found it ugly, and now works toward civic heroism while still tempted by revenge."
