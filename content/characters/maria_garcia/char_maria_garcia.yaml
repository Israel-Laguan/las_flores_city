id: c2000002-e29b-41d4-a716-446655440002
name: Maria Garcia
title: Flower Farmer
birth_year: 2012
description: A loving mother who tended the Garcia family's flower fields. She was the first to notice the flowers turning red in September 2052, and the first to fall ill. She died in January 2071 from complications of lithium contamination, after years of declining health that her rescue of her daughter Isabella from the poisoned river made worse. Mother of Isabella, Sofia and Alex Garcia.
physical_description: Latina woman in her mid-forties (portrait depicts her in the years before her illness; she died in January 2071 at about 59) with a soft-rounded build, curly dark hair, sun-damaged skin and weathered hands; wears simple flower-farming clothes, an apron and a sun hat.
psychological_description: 'Loving and devoted, willing to risk herself to protect her daughter. Stubborn to a fault, she kept working the fields and hauling river water to the dying flowers, whispering "Just hold on a little longer", rather than stop.'
background_and_role:
  - Flower farmer tending the Garcia family's flower fields
  - Mother of Isabella, Sofia and Alex Garcia; wife of Alejandro
  - Declining health from 2052 until her death in January 2071
  - Died from lithium contamination after rescuing Isabella from the poisoned river
