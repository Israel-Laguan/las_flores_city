name: Maria Garcia
title: Flower Farmer
birth_year: 2012
description: A loving mother who tended the Garcia family's flower fields. She died from complications of lithium contamination after rescuing her daughter Isabella from the poisoned river.
physical_description: Latina woman in her forties with a soft-rounded build, curly dark hair, sun-damaged skin and weathered hands; wears simple flower-farming clothes, an apron and a sun hat.
psychological_description: Loving and devoted, willing to risk herself to protect her daughter.
background_and_role:
  - Flower farmer tending the Garcia family's flower fields
  - Mother of Isabella
  - Died from lithium contamination after rescuing Isabella from the poisoned river
