name: Maria Martinez
title: Founder, Fundación Esperanza
birth_year: 2022
description: Beloved educator who founded Fundación Esperanza to promote education, community development, and capacity-building in Old Las Flores. The foundation empowers marginalized communities through lifelong learning.
physical_description: "Latina educator in her 50s with a soft, rounded, welcoming build; round face, curly dark hair threaded with silver, gentle wrinkles and reading glasses, with a Fundación Esperanza lanyard."
psychological_description: "Kind and patient, with the warm bearing of a beloved teacher. Gives too much of herself to everyone and is shrewd about donors, in a foundation whose supporters include businessmen with their own interests."
