id: c2000003-e29b-41d4-a716-446655440003
name: Alex Garcia
title: Architecture Student, Futuro Brillante Scholar, Leader of the 2077 Grassroots Movement
birth_year: 2055
description: The central protagonist of the 2077 endgame arc. Youngest child of the Garcia flower-growing family by the Río de las Flores, Alex grew up knowing the cost of corporate greed intimately — their mother Maria died in 2071, when Alex was 16, of lithium-contaminated water. Alex enrolled at Universidad Nacional de Las Flores in 2075 to study sustainable urban design on a Futuro Brillante scholarship. After moving into Residencial Las Estrellas, Alex noticed a pattern of suspicious deaths and began investigating, eventually discovering Evelyn Ruthenberg's vigilante campaign. The revelation that Evelyn was targeting the people responsible for the contamination that killed their mother transformed Alex's grief into directed action. Alex built a grassroots movement that brought the fight into the light, and died in 2077 detonating an abandoned mine to create an improvised dam — saving the city from a catastrophic flood and buying Evelyn and the others the cover they needed to escape.
physical_description: "22-year-old Latino person of lean, wiry, medium-height build with straight, shaggy dark hair, hooded dark eyes with faint dark circles and a heart-shaped face; ink-stained hands, jeans, a hoodie, old sneakers and an overstuffed backpack of sketchbooks."
psychological_description: "Brilliant and driven, a survivor who channeled grief over their mother's death into school and then into directed action. Warm and self-deprecating, bad at accepting compliments, and prone to sketching when nervous. Never forgives themselves for hesitating, which is why they act before anyone agrees on a plan, burn themselves out, and in the end go to the mine alone."
background_and_role:
  - "Architecture student on a GLC Futuro Brillante scholarship"
  - "Central protagonist of the 2077 endgame arc"
  - "Leader of the grassroots movement against corporate contamination"
  - "Youngest child of Alejandro and Maria Garcia; the flower-field family's only university student"
  - "Core of an investigation group with Miguel Jhonson, Ana Kim, Isabella Vargas and Carlos Medina; uneasy ally of Evelyn Ruthenberg"
  - "Dies in 2077 detonating an abandoned mine to save the city from a flood"
metadata:
  type: human
  role: npc
  faction: independent
  personality: brilliant_survivor
  age: 22
  gender: Non-binary
  occupation: Architecture Student
  physical_description: Lean, medium height, dark hair usually in need of a cut, hands covered in pencil marks and ink stains. Dresses practically in jeans, hoodie, and old sneakers. Carries a worn backpack overstuffed with sketchbooks and urban planning texts.
  background: Born ~2055 in the Garcia family's flower-growing village by the Río de las Flores, youngest child of Alejandro and Maria Garcia and younger brother of Isabella and Sofia. Mother Maria died from lithium contamination in 2071 when Alex was 16. Father Alejandro withdrew into silence. Alex channeled everything into school and won a GLC Futuro Brillante scholarship as a high school senior.
  residence: Residencial Las Estrellas, Sector Norte (formerly)
  mannerisms: Prone to sketching buildings when nervous. Terrible at accepting compliments. Genuinely funny in small groups. Hesitates before helping and never forgives themselves for hesitating.
  motivations: Uncover the truth about the corruption poisoning Las Flores. Build a better city through sustainable urban design. Ensure no one else loses a mother to corporate greed.
  fears: Failing the people who trust them. Being too late. Becoming the kind of person who stands frozen while others act.
  goals: Expose the LW Group's corruption. Build a grassroots movement that survives beyond any single leader. Create a city worth living in.
  challenges: Poverty, scholarship pressure, grief, the moral weight of leading others into danger.
  quote: This neighborhood will be better built next time.
  status: Deceased (2077)
  death: Died in a mine explosion while creating an improvised dam to save Las Flores from a catastrophic flood.
