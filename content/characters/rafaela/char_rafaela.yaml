name: Rafaela
title: Ex-Wife of Peter van der Meer
birth_year: 2022
description: "Brazilian socialite who married Peter van der Meer in a marriage of convenience and gave a tell-all interview in 2070. Expressive, physical and warm, she turned scrutiny into a media career and encourages her son Peter Jr. toward a public, glamorous life."
physical_description: "Latina woman in her 50s with an athletic-compact build; heart-shaped face, high cheekbones, wavy dark styled hair with gray streaks, almond eyes and full lips, dressed as a well-to-do socialite with tasteful jewelry."
psychological_description: "Expressive, warm and attention-hungry; loud with love, fluent in cameras, and unsure whether she is protecting her son or using him."
