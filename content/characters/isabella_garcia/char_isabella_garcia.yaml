name: Isabella Garcia
title: Bitter Artist & Contamination Survivor
description: The middle Garcia child who fell into the poisoned river as a child, leaving her with chronic respiratory problems. She copes through painting and writing, but has grown increasingly bitter. Resentful that her younger sister Sofia gained more money and respect in the community despite her deafness, Isabella distanced herself and treats her sister rather poorly, feeling her own ailments held her back.
