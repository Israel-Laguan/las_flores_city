  - Author of an article on policing disparities between rich and poor neighborhoods
  - Exposes Business Coalition influence over Las Flores politics
  - "Policing-disparity critic: Villa Dorada vs Barrio Viejo; ally of Councilwoman Ana Silva"
  - "Same structural beat as La Prensa's Laura Silva; shares the surname Hernandez with several unrelated Carloses"
  - "Not part of the 2077 core group"
