description: Wrote 'Why are Police More Present in Rich Neighborhoods? And Who's Protecting the Poor?' exposing policing disparities and Business Coalition influence over Las Flores politics.
physical_description: "Lean, wiry Latino man in his early 30s with warm-brown skin, straight untamed dark hair, a long face with prominent jaw, bright watchful round eyes and a slightly asymmetric smile; wears a plain tee under an open overshirt with a laptop bag."
psychological_description: "Restless and engaged grassroots activist with sharp, alert energy. Writes the argument first and then looks for the fact; afraid of being right and ignored."
background_and_role:
