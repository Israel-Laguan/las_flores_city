name: Diego López
title: Business & Economics Editor, El Informador
birth_year: 2032
description: Covers economic development and investment in Las Flores. Began his career covering local business news before joining El Informador.
physical_description: Latino man in his 40s with a stocky, comfortable build, olive-tan skin, wavy dark hair threaded with gray, thick brows and narrow appraising eyes; wears business-casual editor attire with reading glasses looped on a chain.
psychological_description: A business journalist; appraising and methodical, focused on economic development and investment in Las Flores. Checks every figure twice and fears being wrong in print about a number.
background_and_role:
  - Business & Economics Editor at El Informador
  - Began his career covering local business news
  - Covers economic development and investment in Las Flores
  - Joined El Informador from a regional newspaper and now oversees its economic coverage
  - Reports to editor-in-chief Juan Rodríguez; supplies the money trail for María Suárez's corruption stories
  - Informant NPC for investment, contracts, property and port finance
