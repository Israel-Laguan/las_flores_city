name: Maria Martinez van der Meer
title: Matriarch of the van der Meer Family; President of Fundación Esperanza
birth_year: 2020
description: Born into a prominent Las Flores family (the Martinez family of Old Las Flores) with deep social and political roots. Educated at exclusive European institutions, she married Jan van der Meer, son of industrialist Pieter van der Meer, in 2040 and became mother to Anna, Peter and Lucas. A legendary beauty with a compassionate heart, she hosted lavish galas and backed charities in education, healthcare and poverty relief. From about 2055 she was the public face and president of Fundación Esperanza, a foundation started by Old Las Flores citizens and taken over by the Van der Meers as a means of political pressure; Sophia van der Meer Rodriguez succeeded her about 2071 as dementia set in, with Anna caring for her. Found solace with Dirk, an elderly servant and constant companion.
physical_description: "Medium-height woman with dark, expressive eyes, a straight nose, a defined jaw and dark flowing hair, with a calm, steady and composed bearing."
psychological_description: "Elegant, charming and intellectually keen, with a compassionate heart beneath her glamorous persona; quietly strove to present a united front for her family."
