id: c1000012-e29b-41d4-a716-446655440012
name: Karla
title: Activist, Farmer
birth_year: 2025
description: A young activist and farmer, approximately 28 years old, murdered in February 2053. She was a local farmer who planted Carinata — a drought-resistant crop used for biofuel — and discovered that lithium contamination from Minera Estrella had poisoned her plantation. She had worked with biologist Cecilia Pérez on a Carinata study and continued it on her plantation, confirming that Carinata resists lithium, and was preparing to demand accountability from the mining company when she was targeted. On the day of her death, she was found bleeding in an alley by a young Evelyn Ruthenberg. Before dying, she gave Evelyn a key, a small green pouch containing Carinata seeds that had surprisingly resisted the contamination, and a note. She asked Evelyn to deliver these to her sister Nubia and tell her to take the money and flee the city. Her evidence became the foundation of the case against Minera Estrella.
physical_description: "Young Latina woman with dark hair in neat braids, a vibrant yellow dress and a frail build at the time of her death."
psychological_description: "Brave and determined; she gathered evidence of lithium contamination and prepared to demand accountability from the mining company."
background_and_role:
  - University graduate (agricultural science) who worked professionally before turning to farming
  - Local farmer growing Carinata for biofuel
  - Worked with Cecilia Pérez on the Carinata study and continued it after her death
  - "Activist against Minera Estrella's lithium contamination"
  - Murdered in February 2053
