description: Oversees La Prensa's operations in Las Flores. Pivotal in building the newspaper's presence and credibility in the city through insightful local coverage.
physical_description: "Latina woman in her 40s with an athletic-compact, poised build; angular face, high cheekbones, wavy dark chin-length hair and a small mole near her lower lip, dressed in professional attire with press credentials."
psychological_description: "Sharp and commanding, with a focused, editorial bearing. Cautious in a city where local media avoid the leak, and she carries the bureau's local risk."
