name: Manuel Ortega
title: Former Smuggler, Cartel Link
birth_year: 2014
description: Manuel Ortega, commonly known as "El Viejo" (The Old Man), is a 63-year-old former smuggler who has now transitioned into a pivotal link for a powerful cartel operating in Old Las Flores and the city center. Originally from San Pedro de los Pescadores, Manuel grew up in a fishing family but was lured into the world of smuggling as a young man seeking excitement and fortune.
physical_description: Latino man in his early sixties with a lean wiry build, long weathered face, thin gray-white receding hair, deep-set eyes and a faded smuggling scar across his right cheek; dresses in practical fisherman's layers.
psychological_description: Intelligent and professional, a seasoned operator shaped by years of smuggling.
background_and_role:
  - Known as "El Viejo"; former smuggler from a San Pedro de los Pescadores fishing family
  - Pivotal link for a powerful cartel in Old Las Flores and the city center
