name: Liu Fang
title: Former LW Group Employee / Whistleblower
description: A brave whistleblower from LW Group who collected irrefutable evidence of the Great Lithium Leak cover-up. She was murdered in an alleyway by corporate assassins in 2055 just before the trial. Before she died, she managed to pass her evidence to a student. The student later sent it to the press, but after they ignored it, posted an encrypted sample to an underground network; Evelyn Ruthenberg tracked down the student and secured the drive.
