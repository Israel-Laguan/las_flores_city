id: c1000004-e29b-41d4-a716-446655440004
name: Liu Fang
title: Former LW Group Employee / Whistleblower
birth_year: 2021
description: A brave whistleblower from LW Group who collected irrefutable evidence of the Great Lithium Leak cover-up. She was murdered in an alleyway by corporate assassins in August 2059 just before the trial. Before she died, she managed to pass her evidence to a student. The student later sent it to the press, but after they ignored it, posted an encrypted sample to an underground network; Evelyn Ruthenberg tracked down the student and secured the drive.
physical_description: Slender Chinese woman in her late 30s (about 38, depicted shortly before her murder in August 2059; no 2077 version) of average height with shoulder-length black hair, intelligent wary dark brown eyes, small rectangular glasses and a neat professional blouse and blazer.
psychological_description: Courageous and precise, nervously vigilant and determined to expose the truth despite the danger.
background_and_role:
  - Former LW Group employee turned whistleblower
  - Collected evidence of the Great Lithium Leak cover-up
  - Murdered in August 2059 just before she was due to testify
