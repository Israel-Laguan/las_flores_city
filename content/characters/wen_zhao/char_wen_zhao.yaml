id: d1fc0275-af55-4fe0-8fc2-a36c42c264ae
name: Wen Zhao
title: Business Student, Secret Libertine
description: |
  Wen Zhao is a plain-looking young Chinese woman in her early 20s, daughter
  of strict Chinese immigrant parents in the northern district. She and Layla
  are two sheltered, uptight girls who sit together at lunch because no one
  else invites them — not popular, not pretty, not the girls anyone asks out.
  Wen's rebellion is compensatory: she dresses aggressively provocative on a
  frame that doesn't command attention, forces confident posture into a body
  that disappears in a crowd, and chases a cinematic movie-romance to prove
  she *can* be desired. She started as Layla's confidante but is fully capable
  of manipulating or abandoning Layla to secure her own starring role. She
  wants a boyfriend the way someone wants proof of concept — not love, just
  evidence that the plain girl can win.

metadata:
  type: human
  role: npc
  faction: independent
  personality: manipulative_thrill_seeker
  age: Early 20s
  gender: Female
  ethnicity: Chinese
  occupation: University business student
  physical_description: long narrow face, bony jutting jaw, small close-set eyes with heavy imprecise eyeliner, thin overlined lips, flat straight black hair scraped into a tight high ponytail; not fat but not skinny — small A-cup bust on noticeably broad square shoulders, a stocky un-model-like torso that disappears in a crowd rather than flatters; aggressively provocative low-cut clothing at university that reads as defiant overcompensation rather than natural allure (the clothing does the work, the body underneath is unremarkable and a little awkward on her frame); changes instantly to shapeless modest home-wear at the threshold; forcibly confident posture — chin up, broad shoulders back, elbows out, deliberately taking up space she was never naturally given
  background: born in Las Flores to strict Chinese immigrant parents in the northern district; the community's watchful eye shaped her double life
  education: university business student
  mannerisms: sharp-tongued, performatively confident, prone to pushing others into reckless decisions; frames manipulation as "helping"; openly defiant with her mother (will yell, will argue); completely submissive in front of her father; drops hints of real vulnerability only in private, and immediately regrets it
  motivations: feel the thrill of a high-octane movie romance; have a boyfriend as a trophy and a performance; defy family control on her own schedule; never end up as the boring "good daughter" who gets nothing
  fears: her father discovering her double life; the movie-romance running out before she is ready; realizing she may not actually want anything real
  goals: secure the most dramatic, passionate boyfriend-experience she can; eventually leverage independence from her family once she has the thrill safely in hand
  challenges: she compels the player into genuinely reckless situations that have real consequences; she cannot distinguish movie-logic from real danger; she has no exit plan when the drama becomes real
  quote: "Layla wants romance. I want the movie. There's a difference — the movie doesn't have to end well, it just has to be unforgettable."
