description: A small business owner who serves as a vital verifier for Humanity First's projects. His practical skepticism and keen eye are essential for ensuring funds are used transparently.
physical_description: "Stocky, broad-shouldered Latino man in his early 70s with weathered olive-brown skin, thick wavy dark hair graying at the temples, wide-set deep brown eyes and a strong jawline; wears a collared shirt with rolled sleeves and carries a weathered clipboard."
psychological_description: "Practically skeptical and exacting, a small-business owner who polices other people's money; suspicion that sometimes becomes policy."
