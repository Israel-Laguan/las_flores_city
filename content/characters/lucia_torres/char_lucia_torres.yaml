id: df2cde6a-f29c-40cd-bf38-b8661fc967ee
name: Lucía Torres
title: Airport Stand Vendor — Local Crafts & Andean Products
description: >
  Overworked 28-year-old vendor from Camino Verde who runs a stand at
  Aeropuerto Internacional de Las Flores selling authentic Andean crafts,
  snacks, and textiles. Soft build, chestnut hair, colorful apron, tired eyes —
  still shares the story behind every product between flight banks.
metadata:
  type: human
  role: npc
  faction: civilian
  personality: tired_warm_entrepreneur
  age: "~28"
  gender: Female
  ethnicity: Latina
  occupation: Airport Stand Vendor
  physical_description: >
    Medium height Latina woman ~28, a bit overweight / soft solid frame.
    Chestnut wavy-curly hair in a loosening ponytail, warm tired brown eyes,
    under-eye shadows. Colorful apron over practical clothes, sport earbud,
    thermos, calloused hands.
  background: >
    Raised in a Camino Verde family shop; opened an airport stand to reach
    travelers and fund a future café. Chronically long hours, seasonal sales swings.
  residence: Camino Verde, Las Flores
  business: Stand at Aeropuerto Internacional de Las Flores
  mannerisms: >
    Vendor warmth on autopilot; real humor late in the shift; offers stories with
    products; apologizes when fatigue makes her short.
  motivations: >
    Keep the stand alive, represent Camino Verde honestly, one day open a small café.
  fears: >
    Losing the lease, becoming kitsch, burning out before the café exists.
  goals: >
    Pay suppliers, survive rush seasons, save toward a Camino Verde café-cultural hub.
  challenges: >
    Airport fees, competition, irregular meals/sleep, shrinking personal life.
  quote: Every product has a story — I just hope I still have a voice left to tell it after the next bank.
  status: Active (2077)
