name: Valentina Rojas
title: Curious Girl from the Mountains
birth_year: 2066
description: 11-year-old girl from the Andean Mountains of Las Flores, living with her parents near a small hotel where they work. Dreams of becoming an environmental scientist or an artist to help her community.
physical_description: "A small, sturdy girl of about 11 with wavy black hair in two ponytails, sparkling dark brown eyes, a straight nose and a bright smile; wears modest but well-kept clothing with colorful patterns and often carries a drawing of the mountains."
psychological_description: "An energetic, curious and clever dreamer who spends her free time reading and drawing, asks endless questions about the world beyond her village, and wants to make a difference for her family and community."
background_and_role:
  - "11-year-old schoolgirl from the Andean Mountains"
  - "Daughter of hotel workers; lives near the hotel where her parents work"
  - "Dreams of becoming an environmental scientist or an artist"
