name: Simon De Vries
title: Engineering Student, Universidad Nacional
birth_year: 2056
description: A 21-year-old engineering student in Las Flores, Simon is the son of a Dutch sailor and a local woman. He grew up in a modest household, supporting his mother while receiving annual visits from his father at sea. A dedicated student with a passion for maritime technology, he aims to work at the port and support his family. His engineering studies and love for ships reflect his blended heritage and ambition.
physical_description: "Lean, athletic young man with sandy blonde hair and deep blue eyes; dresses casually but professionally."
psychological_description: "Hardworking, compassionate and over-eager to fix things; torn between a mother who stays and a father who is always at sea."
