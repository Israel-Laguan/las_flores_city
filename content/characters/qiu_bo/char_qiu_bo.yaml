name: Qiu Bo
title: Head of Tech & Innovation, LW Group
birth_year: 2018
description: Drives the LW Group's ventures into next-generation lithium extraction and renewable energy technologies, keeping the conglomerate at the industry's forefront.
physical_description: "Chinese man in his late 50s with a lean, wiry build and clear skin; square face with pronounced cheekbones, receding straight dark-gray hair, thick brows and a small mole on the left cheek."
psychological_description: "Focused innovator driven to keep the conglomerate at the forefront of its industry. The engineer whose 2049 containment proposal was blocked, and who then executed the cover-up of the 2052 leak, so he is both the man who offered the fix and the one who hid its absence."
