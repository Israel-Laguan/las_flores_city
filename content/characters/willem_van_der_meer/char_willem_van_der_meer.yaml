description: |
  Willem van der Meer is a mining executive at Van der Meer Industries, the family's mining conglomerate. He oversees operations and continues the family legacy in Las Flores' mining sector.
physical_description: Dutch man in his early 60s; tall, broad-shouldered, upright executive posture; square strong-jawed face with weathered fair skin and deep-set pale blue eyes; gray hair swept back and close-cropped at the sides; impeccably tailored dark suit, white shirt, muted silk tie, small earbud clipped to his earlobe
psychological_description: Calculated and enterprising; composed, watchful and businesslike; measured confidence, protective of the family's standing
background_and_role:
  - Dutch heir of the Van der Meer mining family
  - Mining executive at Van der Meer Industries
  - Oversees operations and sustains the company's position in Las Flores' regional economy
