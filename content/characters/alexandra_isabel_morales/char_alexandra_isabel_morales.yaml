name: Alexandra Isabel Morales
title: Las Flores Resident
birth_year: 2049
description: A 28-year-old language teacher who specializes in English and Chinese in San Pedro de los Pescadores. Originally from Old Las Flores, Izzy has always been captivated by the idea of a sophisticated lifestyle often associated with the bustling city. Despite her humble beginnings, she has worked hard to establish herself as an engaging and trendy educator. Appearance Izzy carries herself with a polished demeanor that reflects her desire to be perceived as a classy city girl.
physical_description: "28-year-old Latina woman, petite and slender with long straight black hair in loose waves, almond-shaped dark brown eyes and a warm ivory complexion; small gold hoop earrings and a tailored blazer over a blouse."
psychological_description: "Passionate and polished, eager to be seen as a sophisticated city woman despite her humble beginnings."
