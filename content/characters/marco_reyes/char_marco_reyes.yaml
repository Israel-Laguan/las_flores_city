name: Marco Reyes
title: Retired Dockworker, Union Organizer
birth_year: 2010
description: A retired dockworker from the Port District, Marco Reyes spent thirty years organizing labor at the port facilities. He knew Miguel Jhonson's father from the union and became an unexpected ally of the 2077 movement, providing access to the port's storage facilities for supply caches. He was instrumental in smuggling evidence documents out of the city to international journalists when the local media was compromised. After the transition, he advised on labor policy reform.
physical_description: Broad, heavily built Latino man in his late sixties with a weathered scarred face, thin gray-white receding hair and rope-burn scars on his hands; wears a worn dockworker jacket, union cap and heavy boots.
psychological_description: Gruff but kind, a lifelong organizer with a steady commitment to workers.
background_and_role:
  - Retired Port District dockworker with thirty years of labor organizing
  - Ally of the 2077 movement who provided port storage for supply caches
  - Advised on labor policy reform after the transition
