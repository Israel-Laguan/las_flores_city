id: d4e5f6a7-b8c9-4d0e-9f2a-3b4c5d6e7f8a
name: Peter van der Meer Jr.
title: Young LGBTQ+ Advocate & Van der Meer Heir
birth_year: 2063
description: Son of Peter van der Meer and Rafaela. A teenage heir and the youngest public face of Amor Verdadero, an organization championing queer causes. Outspoken LGBTQ+ advocate and managed influencer in Las Flores; he says he wants to study law. His manager runs his content calendar and his mother encourages a very public life, so the central question is who this performance is for. His rainbow pin is both brand and mask — the more the player sees past it, the more they see him. Romantic path unlocks at Act 3 once the player has dug deep enough (pjr_dig >= 1) to see beyond the prop.
physical_description: "Dutch-Brazilian mixed boy of about 14 with a lean, wiry build and clear olive-fair skin; angular face with high cheekbones, prominent jaw, wavy dark-blonde hair, thick brows and a small scar near the right ear."
psychological_description: "Warm and performative in public, detached in private; sincere but unsure which parts of his public life are his own."
background_and_role:
  - "Son of Peter van der Meer and Rafaela"
  - "Van der Meer heir"
  - "Youth ambassador of Amor Verdadero"
  - "Young LGBTQ+ rights advocate in Las Flores; aspires to study law"
