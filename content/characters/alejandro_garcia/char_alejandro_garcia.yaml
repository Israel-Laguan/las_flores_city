name: Alejandro Garcia
title: Flower Farmer, Construction Worker
birth_year: 2008
description: A hardworking father who lost his wife to lithium contamination. He tends the Garcia family's poisoned flower fields, then takes construction jobs to support his three children.
physical_description: "Latino man of about 69 (2077) with a stocky build, sun-damaged brown skin with deep lines, thick curly hair gone white-grey and a square face with hooded dark eyes; worn work clothes with sleeves rolled, a sweat-stained cap and callused hands with faint chemical stains. In flashbacks (~2052) he is in his early 40s with dark curly hair graying only at the temples."
psychological_description: "Resilient and hardworking, a provider devoted to his children."
background_and_role:
