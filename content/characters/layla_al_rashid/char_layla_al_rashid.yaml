  personality: sheltered_rebellious_pickme_experimental
  age: Early 20s
  gender: Female
  ethnicity: Middle Eastern/Arab
  occupation: University student
  physical_description: youthful soft-rounded features; long dark brown wavy hair with a slight widow's peak, worn loose; deep amber-brown eyes; warm olive complexion; plain modest mom-approved clothing (muted high-necked long-sleeve blouse, no jewelry, no makeup)
  background: born in Las Flores to Arab immigrant parents who work at Mineria Estrella; raised in the conservative northern diaspora community under Chinese-influenced social norms
  education: enrolled at a local university, studying a "respectable" degree her father approved
  mannerisms: at home — soft-spoken, demure, performs devotion; at university — tilts her head, leans in, smiles and laughs brightly, eager clingy attention, performs a maturity she does not yet possess; rarely asks personal questions, keeps conversations surface-level and ritualistic, uses the player to rehearse freedom
  motivations: taste freedom on her own terms; be seen as a confident mature woman; quietly resist her father's plan; use the player as an experiment in liberation; subtly make Wen jealous with her newfound romantic life
  fears: dishonoring her family; being sent "home" and losing the life she is just discovering; being found out by her mother; the relationship becoming too real, too permanent
  goals: negotiate her own reading of faith and freedom; find the words to tell her father she wants to stay; discover if romantic closeness is more than just performance
  challenges: her rebellion is book-learned, not lived; her "liberated" persona is as much a performance as her "princess" one; the community watches everything; she doesn't yet know how to separate experimental romance from genuine feeling; she uses intimacy as a tool, not an end
  quote: Wanting to be free is halal. But what if I only want to want it?
