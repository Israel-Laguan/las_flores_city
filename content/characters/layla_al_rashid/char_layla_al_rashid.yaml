id: d9927cf6-cc6c-42d3-b39c-023e6252b453
name: Layla Al-Rashid
title: University Student, Double Life
description: |
  Layla Al-Rashid is a young Arab woman in her early 20s, daughter of Mineria
  Estrella workers, raised in the tight-knit northern district where the Arab
  diaspora lives under strong Chinese-community influence. At home and within
  her community she performs the perfect devout "princess" — obedient,
  sheltered, demure. At university she is quietly rebelling, modeling a
  confident, liberated woman on films and books, and flirting back whenever
  someone flirts with her — her first, naive act of freedom. She uses the
  player as a living experiment to feel liberated, to perform the role of
  "girlfriend" she read about in books, and in part to make her friend Wen jealous.
  She resists long-term commitment, asks few personal questions, and keeps the
  relationship ritualistic — until, slowly, she begins to discover what it means
  to be romantically close, not just performatively so.
metadata:
  type: human
