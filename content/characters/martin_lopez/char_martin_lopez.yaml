description: 55-year-old veteran journalist and investigative reporter at El Informador de Las Flores. Began as local newspaper reporter. Tenacious truth pursuit uncovered corruption and organized crime. Despite threats from powerful figures, continued work, earning most respected journalist reputation. Unyielding truth commitment drives him to pursue difficult stories regardless of risks. Keen analytical mind connects events, exposes hidden corruption.
physical_description: "Weathered 55-year-old Latin American man of medium build with weary but sharp dark brown eyes, thinning dark hair streaked with gray, combed back and practical work clothing."
psychological_description: "Tenacious and analytical, with an unyielding commitment to the truth that pushes him toward difficult stories regardless of risk."
