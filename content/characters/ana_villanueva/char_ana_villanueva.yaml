name: Ana Villanueva
title: Office Assistant and Online Seller
birth_year: 2050
description: |
  An office assistant at a mid-size import-and-distribution firm near the port who spends her nights running a small online store of imported clothes and beauty goods that she promotes on her social network. An entrepreneur in the making, she is an empowered, confident young woman focused on making it big and scaling the store into a brand. She has no connection to Alex Garcia's group or the Las Estrellas investigation.
physical_description: "27-year-old Latina woman, lean and unassuming with clear warm olive skin, straight dark brown hair, sharp watchful almond eyes and an oval face; jeans, an oversized sweater and a messenger bag."
psychological_description: "An entrepreneur in the making: confident, empowered and ambitious, focused on making it big."
background_and_role:
