name: Ana Villanueva
title: Independent Shadow Journalist (Former Student)
description: |
  A former sociology student drawn into a corporate conspiracy years ago after a deadly car chase. After navigating police betrayals and the fallout of the Evelyn Ruthenberg events, she dropped out of university to become a "shadow journalist." In 2077, she operates entirely off the grid, publishing under pseudonyms and feeding airtight evidence to trusted mentors while remaining invisible to corporate retaliation.
