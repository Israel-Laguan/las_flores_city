  occupation: Chief of Operations / Head of Corporate Security (LW Group)
  physical_description: >
    Athletic-compact Chinese–Korean man ~50. Straight dark hair graying and
    receding. Narrow cold eyes, thick brows, thin lips, faint scar on left jaw,
    sport earbud, dark practical security attire.
  background: >
    Born ~2027. Rose through LW security after the leak years. Handler for
    Viktor Reyes by the mid-2050s; oversaw the Student’s Flight assassination
    optics from Café de las Mañanas. Still active Chief of Operations in 2077.
  mannerisms: >
    Speaks in short operational lines. Cold stillness. Thin smirk instead of
    warmth. Treats people as risk ratings.
  motivations: >
    Keep Li Wei’s machine deniable. Contain leaks. Maintain distance from blood.
  fears: >
    Loss of control — loud assets, uncontrollable players, evidence that puts
    him in the alley instead of the café.
  goals: >
    Manage outcomes from a safe distance; cut liabilities; remain indispensable.
  challenges: >
    Documentary trails, flipped assets, resistance that does not fear medics.
  quote: I manage outcomes. Other people manage blood.
  status: Active (2077)
