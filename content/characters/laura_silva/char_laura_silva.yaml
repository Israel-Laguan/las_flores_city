  - "Exposed the Business Coalition's shadow government"
  - Author of a piece on elite manipulation of local politics
  - "Author of 'How the Business Elite Manipulate Local Politics'"
  - "Placed at La Prensa's Las Flores bureau (the lore names no outlet)"
  - "Rival and sometimes ally of Alejandro Ruiz on the political-money beat"
