name: Alberto Santiago
title: El Pescador - Coastal Seafood Vendor
description: |
  Alberto Santiago, known as 'El Pescador,' is a sturdy, sun-weathered seafood vendor who brings fresh Pacific Coast catch to Las Flores restaurants daily. Standing about 5'10" with thick black hair streaked with silver and a calm, knowing smile, he carries himself with the dignified bearing of a man who has spent five decades mastering his trade. His daily work clothes are practical—sun-faded work shirt and worn trousers—but he takes pride in his appearance and has a nicer set of clothes he wears when making special deliveries or visiting the bakeries where he knows certain someone might be working.

  At 50, he balances gravitas with charm. Lively and outgoing, Alberto charms others with dry humor and warm optimism. He grew up in a fishing family along the Pacific Coast, learning the trade from his father, and established a successful seafood vending business. Each morning he delivers fresh catch to restaurants, chatting with chefs about the freshest offerings.

  After deliveries, he indulges his sweet tooth at local bakeries, delighting in artisan sweets and playful flirting. He dreams of expanding his business and spreading joy through coastal flavors, valuing the connections he makes with customers and community.
