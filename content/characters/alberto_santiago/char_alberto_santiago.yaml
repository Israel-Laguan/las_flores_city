name: Alberto Santiago
title: El Pescador - Coastal Seafood Vendor
description: |
  Alberto Santiago, known as 'El Pescador,' is a sturdy, sun-weathered seafood vendor who brings fresh Pacific Coast catch to Las Flores restaurants daily. Standing about 5'10" with thick black hair streaked with silver and a calm, knowing smile, he carries the dignified bearing of a man who has spent five decades mastering his trade. His practical work clothes are sun-faded, though he dresses finer when making special deliveries or visiting the bakeries where someone he admires might be working.

  At 50, he balances gravitas with charm. Lively and outgoing, Alberto charms others with dry humor and warm optimism. He grew up in a fishing family along the Pacific Coast, learning the trade from his father before establishing his own seafood vending business. Each morning he delivers fresh catch to local restaurants.

  After deliveries he indulges his sweet tooth at local bakeries, flirting playfully, and dreams of growing his business to spread joy through coastal flavors.
