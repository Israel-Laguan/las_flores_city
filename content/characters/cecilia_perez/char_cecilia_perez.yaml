id: a57b0025-75d1-4e0d-9bb3-f7c8d9e2a380
name: Cecilia Perez
title: Safety Auditor & Independent Researcher
birth_year: 2025
description: Hired by Minera Estrella as a safety auditor in her early twenties, she documented structural weaknesses in the containment systems that were suppressed by LW Group. She then pivoted to independent research, obtaining a university grant under a cover proposal to study native and introduced plant species, specifically Carinata, and their influence on the local ecosystem. Her data proved pre-leak contamination. Murdered in City District in 2049, weeks from publishing. After her death her audit data passed to Liu Fang, while her Carinata preprint, continued by Karla, reached Evelyn Ruthenberg through Karla and Nubia's apartment.
physical_description: "Slender, wiry Latina woman in her early 20s, slightly below average height, with dark brown shoulder-length hair in a messy bun, intense warm brown eyes, light olive-toned skin and small wire-framed glasses; wears a practical lab coat over a blouse."
psychological_description: "Courageous and investigative; focused and intense, pursuing the truth about contamination despite the danger."
background_and_role:
