name: Diego Huamán
title: Agroecology Student and Community Advocate
birth_year: 2058
description: |
  Diego Huamán is a 19-year-old Agroecology and Rural Development major (within the environmental sciences faculty) at the university in Central Las Flores. He grew up in a small Andean village where his family farms potatoes, quinoa, and raises llamas. His parents instilled hard work and education as the path forward.

  Diego is tall and broad-shouldered, with a hiker's build from years on mountain trails and the family farm. He carries a handwoven mochila everywhere. Outgoing and a natural storyteller, he organizes Andean cultural nights, seed swaps, and campus petitions. Despite financial pressure from part-time café work, he stays deeply connected to his Andean heritage through music and cultural events, and plays the charango in front of a crowd.

physical_description: Tall, broad-shouldered 19-year-old Andean man with a hiker's build, clean-shaven, wind-weathered sun-kissed skin and warm brown eyes; dark curly hair grown long on top and tied half back with a red-and-ochre woven headband; wears a faded brick-red university hoodie, jeans and hiking boots, with a handwoven striped mochila slung across his chest.
psychological_description: Outgoing, ambitious and resilient; a friendly storyteller and organizer, respectful and curious, driven by loyalty to his community and fear of losing touch with his roots.
background_and_role:
  - Agroecology and Rural Development major at the Central Las Flores university; campus organizer of Andean cultural events
  - Raised in an Andean farming village; plays the charango
  - Plans to return home and start a sustainable farming cooperative
  - Volunteers with the grassroots coalition CJS and studies under the environmental scientist Maria Hernandez (links invented, see lore)
