name: Cecilia Rodríguez
title: Community Nurse / Off-duty Witness
birth_year: 2030
description: |
  Juan Rodriguez's much younger half-sister and a dedicated community nurse who runs a health clinic in San Miguel del Monte. She is pragmatic, calm under pressure, and deeply committed to her community. She inadvertently becomes a witness when she attempts to save Liu Fang in the alleyway.
physical_description: "Latina woman of 47 with an athletic-compact build, heart-shaped face, tired but empathetic dark eyes, weathered olive skin and dark wavy hair in a practical bun; wears a faded zip-up jacket over scrubs and carries a well-worn medical bag."
psychological_description: "Calm, pragmatic and protective; steady under pressure and deeply committed to her community."
