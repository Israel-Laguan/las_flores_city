name: Cecilia Rodríguez
title: Community Nurse / Off-duty Witness
description: |
  Juan Rodriguez's younger sister and a dedicated community nurse who runs a health clinic in San Miguel del Monte. She is pragmatic, calm under pressure, and deeply committed to her community. She inadvertently becomes a witness when she attempts to save Liu Fang in the alleyway.
