name: Diego Sulca
title: Environmental Science Student, Fisherman's Son from San Pedro de los Pescadores
birth_year: 2058
description: |
  Diego Sulca is a 19-year-old university student from a modest background, caught between aspiration and anxiety. His mother is from San Pedro de los Pescadores, and his father comes from Old Las Flores, where they instilled in him the values of hard work and perseverance. Diego is determined to make a better life for himself, but he finds himself grappling with the harsh realities of university life.

  Diego has a slim, wiry build from years of helping his mother fish the river, with narrow shoulders and a slight stoop. He has short, messy dark wavy-curly hair, a faint peach-fuzz stubble and warm brown eyes that reflect his inherent kindness but also reveal his shyness. His clothing typically consists of comfortable, rumpled casual wear such as a faded grey work shirt, and he wears a braided blue net-twine bracelet. He prefers practicality over fashion, reflecting his working-class roots.
physical_description: Slim, wiry 19-year-old indigenous Latino man of average height with narrow shoulders and a slight stoop, short messy dark wavy-curly hair, faint peach-fuzz stubble, warm brown shy eyes and light brown olive skin; wears rumpled, practical clothes such as a dusty light grey button-up with rolled sleeves (or a faded university hoodie and cargo pants) and a braided blue net-twine bracelet.
psychological_description: Ambitious, kind-hearted and shy; anxious about his academic struggles but sustained by perseverance and the values his parents taught him.
background_and_role:
  - Environmental Science student at the university, focused on river water quality and fisheries
  - Son of a fisherwoman from San Pedro de los Pescadores and a father from Old Las Flores
  - Wants to advocate for sustainable fishing in his community
  - Classmate of Camila Reyes and fellow San Pedro native of Sofia Aguirre (links invented, see lore)
