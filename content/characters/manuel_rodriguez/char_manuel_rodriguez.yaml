name: Manuel Rodriguez
title: Governor's Representative
birth_year: 2029
description: Appointed Governor's representative for the Pacific District, he abused travel expenses to fund a lavish lifestyle. After being exposed, he plotted revenge against his whistleblower but only further disgraced himself.
physical_description: Medium-height Latino man in his late 40s, slightly paunchy, with thinning dark brown hair and shifty dark brown eyes, a practiced smile, and tailored suits slightly too tight with an expensive gold watch.
psychological_description: Charming but corrupt and vindictive; indulges a lavish lifestyle and lashes out at those who expose him.
