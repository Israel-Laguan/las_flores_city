name: Alejandro Ruiz
title: Senior Investigative Reporter, La Prensa
birth_year: 2032
description: Investigative reporter with a track record of uncovering corporate misconduct and government corruption. His investigations have led to significant legal reforms and high-profile resignations.
physical_description: "Latino man in his 40s with a lean, wiry build and weathered brown skin; wavy dark hair threaded with gray, thick brows and a faint pale scar along the jaw, deep-set watchful eyes, a prominent hawk nose, a short dark goatee, and a rumpled jacket over an open collar."
psychological_description: "Relentless and watchful, driven to expose wrongdoing. Territorial about his sources and cautious with his own files, but reckless with his own safety."
