name: Anna van der Meer
title: Van der Meer Industries Chair & Social Advocate
birth_year: 2041
description: |
  Anna van der Meer is the only daughter of Jan and Maria van der Meer, born into Old Las Flores privilege but shaped by a fierce sense of social responsibility. Independent, outspoken, and politically astute, she first gained attention through environmental protests against Van der Meer mining operations and socially conscious photography on inequality.

  After Jan's death in 2060, Anna took the top role at Van der Meer Industries (today Chair of the board and executive director; her second cousin Sebastian is CEO) and pushed modernization, lower environmental impact, and better worker conditions despite board resistance. She fiercely supported her brother Peter after he came out, co-founded the LGBTQ+ youth nonprofit Amor Verdadero with Peter, cared for Maria as dementia worsened after 2071, and (just after the 2077 present, in 2078) goes on to win a Las Flores City Council seat as a progressive advocate.
physical_description: "Dutch woman of 36 with an athletic, toned build, dark brown hair in a practical but elegant style, deep blue eyes and an oval face with a warm, intelligent expression; typically wears a tailored charcoal suit with a white shirt."
psychological_description: "Empathetic and pragmatic; independent, outspoken and politically astute, driven by a fierce sense of social responsibility."
