name: Roberto Mendoza
title: Retired Minera Estrella Engineer
birth_year: 2005
description: A retired engineer who worked at Minera Estrella during the 2052 lithium leak, Roberto Mendoza quietly provided crucial technical information to the 2077 investigators about the structural failures at the processing facility. He was not among the building owners at Residencial Las Estrellas, but his knowledge of the pipe systems and containment failures helped prove the cover-up. He lived in fear of retaliation for decades, and only came forward when it became clear the movement had the strength to protect him.
physical_description: "Latino man in his 70s with a lean, wiry build, weathered skin, thin white receding hair, spectacles, deep worry lines and a slight tremor."
psychological_description: "Cautious and principled; lived in fear of retaliation for decades before coming forward."
