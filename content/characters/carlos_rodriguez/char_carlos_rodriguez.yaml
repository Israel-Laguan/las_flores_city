name: Carlos Rodriguez
title: Progressive Alliance Leader and City Council Member
birth_year: 2029
description: |
  Carlos Rodriguez is a 48-year-old Progressive Alliance leader and city council member. A founding member of the Alliance, his partnership with Ana Silva — the coalition's environmental policy architect — anchors his agenda. Together they co-authored three contamination oversight bills; two passed in weakened form under LW Group lobbying pressure.

  His contested position defines him: a reformist legislator working in a city whose largest employer is LW Group and whose mayor, Alfonso Vega, is aligned with the LW network. His statements invoke the 2052 Great Lithium Leak and its health impacts; his environmental legislation contains enforcement provisions analysts call toothless.

  Rodriguez is pragmatic: he identifies the achievable within his constraints, achieves it, and calls it progress.
