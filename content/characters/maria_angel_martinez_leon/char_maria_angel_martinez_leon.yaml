id: b9c0d1e2-f3a4-4b5c-ad7e-8f9a0b1c2d3e
name: Maria Angel Martinez Leon
title: Night Receptionist, Pacific Coast
birth_year: 2022
description: An ordinary Pacific Coast resident, known as "Mari", who works the night desk at a beachside hotel near Bahía de las Olas, a job she took years ago as a stopgap and has never been promoted out of. Separated from her husband, she lives alone; her grown daughter has moved to the city and calls on Sundays. She is looking, half-seriously, for someone to share an evening with. She is not connected to the Van der Meer family or to Fundación Esperanza; her name is a coincidence she is tired of explaining. Not to be confused with María Martinez van der Meer.
physical_description: "Latina woman of 55 with a soft, rounded, welcoming build; round face, dark brown eyes, gentle wrinkles and laugh lines, warm tan skin and a short straight black bob with a side part tucked behind one ear."
psychological_description: "Warm, funny and tired; she gives people more patience than her job pays for, keeps her hopes small, and still dresses up a little when someone might be waiting."
background_and_role:
