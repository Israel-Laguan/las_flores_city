metadata:
  type: human
  role: npc
  faction: independent
  personality: cautious_observant_brave
  mannerisms: Verifies every claim by reflex, makes deadpan jokes with a straight face, feeds people without comment, writes in a pocket notebook, sits where she can see the door.
  fears: Being the reason someone else gets hurt; that being useful and being safe cannot be the same thing.
  family: Niece of investigative journalist Lina Kim, who taught her to verify everything and never wanted her in the field.
  status: Alive (studying and freelancing, 2077)
