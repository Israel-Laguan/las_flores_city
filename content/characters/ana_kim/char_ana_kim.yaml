id: e6f7a8b9-c0d1-4e2f-a3b4-c5d6e7f8a9b0
name: Ana Kim
title: Sociology and Journalism Student, Library Worker, Informant Handler
birth_year: 2052
description: |-
  Ana Kim is the niece of investigative journalist Lina Kim, grew up admiring her aunt's career and believed investigative work looked like the detective books she read. A sociology and journalism student who works at the university library where Alex Garcia has a part-time shift, she was drawn into the Residencial Las Estrellas investigation when she came to return Alex's forgotten notebook and ended up helping follow a car. She grew close to Carlos Medina, met Adeyemi's undercover investigator Ken, and watched Carlos die in the chase. Hardened, she stepped back from fieldwork after the City Hall archive break-in injured her, but kept supplying information and contacts, ran Ken as an informant, discovered he was a double agent and double-crossed him, and after Alex's death got the evidence to the press through her aunt. In 2077 she studies and does freelance background-investigation work while keeping a foot in investigative information.
physical_description: "25-year-old Korean woman, petite and neat with a straight black bob, soft dark brown eyes, delicate features and light clear skin; a crisp white button-down shirt under a black blazer (a soft grey cardigan over her shoulders in the outfit variant) and small silver stud earrings."
psychological_description: "Cautious, observant and brave; sharp, warm and direct, with an honest sense of her own limits. Hardened by betrayal, she keeps people at arm's length and goes unreachable in a crisis."
background_and_role:
