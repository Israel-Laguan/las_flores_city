name: Daniel Carter
title: Pioneer, Humanity First
birth_year: 2012
description: The founding Pioneer of the Humanity First movement in Las Flores. Arriving from Canada in 2035, he laid the groundwork for the community councils and the movement's core values.
physical_description: Canadian man in his mid-60s with a broad, heavy build, weathered wind-crinkled skin and a square face; thin receding gray-white hair, thick brows, warm round eyes and a faded scar across one brow; wears a practical weathered jacket with a Humanity First lapel pin.
psychological_description: Visionary founder; warm and community-minded, steady in his convictions about the movement's core values.
background_and_role:
  - Canadian settler who arrived in Las Flores in 2035
  - Founding Pioneer of the Humanity First movement
  - Laid the groundwork for the community councils
