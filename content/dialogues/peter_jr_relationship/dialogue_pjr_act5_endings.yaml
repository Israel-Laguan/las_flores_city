metadata:
  version: "2.0"
  required_flags:
    pjr_act4_done: true
  tags:
    - "peter_jr"
    - "act5"
    - "endings"
    - "ally"
    - "mentor"
    - "rival"
    - "drifted"
    - "distant"
    - "lover"
    - "failed_lover"
    - "enemy"
    - "gate_logic"
  notes: |
    Nine endings, selected by flags and stats (precedence: enemy > lover > failed_lover > rival > drifted > his_own > mentor > ally > distant):
    0. ENEMY: trust <= -30 and alignment <= -20. Active opposition, highest precedence.
    1. LOVER: `pjr_lover_path` with trust >= 75, familiarity >= 70, intimacy >= 60. Romantic relationship.
    2. FAILED LOVER: `pjr_lover_path` + `pjr_romance_broken` with trust >= 50, familiarity >= 60, intimacy >= 40. Fractured romance.
    3. RIVAL: `pjr_rival_path` (mocked, used confession, or leaked). Overrides most paths except enemy/lover.
    4. HIS OWN SCHEDULE: `pjr_found_truth` (set in Act 4 via the mother branch), trust >= 30.
    5. DRIFTED: `pjr_act4_deflected` with trust >= 15 and familiarity >= 30.
    6. MENTOR: mentor path, trust >= 45, familiarity >= 45.
    7. ALLY: friend path, trust >= 50, alignment >= 40, no mentor path.
    8. DISTANT: fallback when trust is below 50 and no specific ending applies.

    Peter Jr. is 14; romantic paths are about first crush feelings, innocence, and discovery.
    The lover path requires high intimacy; failed_lover is for when the romantic connection fractures.
    Enemy path is for active opposition and harm to him or Amor Verdadero.
    Edge case: a player with trust >= 50 who matches no specific ending (for example, the mentor
    path with low familiarity) sees no choice. Verify and adjust thresholds if that appears
    in playtesting.
