id: 9c2e6a10-8f4d-4b7a-9c3e-1a2b3c4d5e05
name: "Valentina Quan - Act 5: Runways"
description: "Her last night in town before a schedule change. Four endings selected by history: Grounded (she agrees to try staying — requires vq_gave_space, vq_trust gte:40, and never having pushed her away), Departure Gate (warm romance left open-ended), Runway Friends (honest and kind), and Shut Out (if she was pushed, she transfers to an international route)."
character_id: 670eea6f-3983-4d5a-8195-b08be6c81661
scene_id: "00000000-0000-0000-0000-000000000000"
dialogue_scope: character
start_node_id: vq_endings_start

nodes:
  vq_endings_start:
    id: vq_endings_start
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "Her roster changed overnight: a long-haul route, a different home base, a life re-shuffled at airline speed. Everything that needed saying between you has been said. She stands by the window with her crew bag packed, watching the runway lights."
    thought: "(Expression: contemplative. She is waiting to see which way he'll let her go — or ask her to stay.)"
    visual:
      expression: contemplative
      position: right
      transition: fade
    choices:
      - id: branch_grounded
        text: "[Ask her to stay — she has room to try]"
        next_node_id: vq_end_grounded_start
        required_flags:
          vq_gave_space: true
        hidden_if:
          vq_pushed_away: true
        required_stats:
          vq_trust: "gte:40"
      - id: branch_shut_out
        text: "[The ground you lost is too much]"
        next_node_id: vq_end_shutout_start
        required_flags:
          vq_pushed_away: true
      - id: branch_departed
        text: "[Let her fly — something real, but the sky calls]"
        next_node_id: vq_end_departed_start
        required_stats:
          vq_trust: "gte:15"
        hidden_if:
          vq_pushed_away: true
          vq_gave_space: true
      - id: branch_friends
        text: "[Keep her — as a friend, honestly and kindly]"
        next_node_id: vq_end_friends_start

  # ============================================
  # ENDING 1: GROUNDED (best — she agrees to try staying)
  # ============================================
  vq_end_grounded_start:
    id: vq_end_grounded_start
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "They gave me the long-haul. Different base. It's the best thing that could've happened to my career and I've been staring at the acceptance screen for an hour trying to remember why I used to want it."
    thought: "(Expression: vulnerable. She already knows the answer and is terrified of it. For the first time in her life, leaving feels like the smaller life.)"
    visual:
      expression: vulnerable
      position: right
      transition: fade
    choices:
      - id: grounded_ask
        text: "'Then decline it. Not for me — for the first version of your life that isn't about exits.'"
        next_node_id: vq_end_grounded_try

  vq_end_grounded_try:
    id: vq_end_grounded_try
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "...You didn't push, that night. And every time since, you've asked for nothing and made room for everything. So here's my answer, and hear every word of it: I will decline the transfer. I will try staying. TRY. Not a promise, not a forever — a first attempt. If I suffocate, I'll tell you instead of vanishing. That's the deal I can actually keep."
    thought: "(Expression: determined. She is choosing the thing her mother never had the option to choose. Her hands shake while she types the refusal, and she lets him watch her do it.)"
    visual:
      expression: determined
    choices:
      - id: grounded_accept
        text: "'A first attempt. Best deal I've ever been offered.'"
        next_node_id: vq_end_grounded_resolved
        relationship_change:
          stat: romance
          amount: 15

  vq_end_grounded_resolved:
    id: vq_end_grounded_resolved
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "Okay. Okay! Grounded, then. Temporarily, suspiciously, experimentally grounded. ...I'm going to be terrible at this. I'll unpack the suitcase one corner at a time. Buy your own house, my mother says. Maybe — maybe — ours first. Don't quote me. I'll deny it at altitude."
    thought: "(Expression: happy. The joke armor is on, but underneath it she has done something no one in her family ever managed: she stayed in the room, on purpose, with the door unlocked. The fear didn't leave. It just stopped being in charge.)"
    visual:
      expression: happy
    is_end: true
    effects:
      flag_set:
        vq_ending_grounded: true
      state_set:
        vq_arc: grounded
        last_vq_encounter_at: NOW
      stat_set:
        vq_trust: 20

  # ============================================
  # ENDING 2: DEPARTURE GATE (warm, open-ended)
  # ============================================
  vq_end_departed_start:
    id: vq_end_departed_start
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "So. Tomorrow it's Singapore, then who knows. I keep drafting a speech about us and every draft ends with me apologizing for the altitude. ...You know what I am, now. All of it. And you're still standing here, which is either very brave or very slow."
    thought: "(Expression: contemplative. She loves him in the only dialect she was taught — presence without permanence. It isn't nothing. It just isn't something she can promise to land.)"
    visual:
      expression: contemplative
    choices:
      - id: departed_ask
        text: "'What do you need this to be, Valentina?'"
        next_node_id: vq_end_departed_ask

  vq_end_departed_ask:
    id: vq_end_departed_ask
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "I need it to be real and unowned. Letters from time zones. A face I look for in every terminal. And I need you not to wait — that's the price, and I hate that it's the price. Waiting turns people into my mother. I've seen how that story ends."
    thought: "(Expression: sad. She is handing him the truest thing she has: herself, in transit, with no arrival time. It's the largest offer she can make without breaking.)"
    visual:
      expression: sad
    choices:
      - id: departed_accept
        text: "'Then don't wait for me either. Just keep coming back.'"
        next_node_id: vq_end_departed_resolved

  vq_end_departed_resolved:
    id: vq_end_departed_resolved
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "Deal. ...You'll be in every layover I take, guapo. Every market, every terrible lounge. That's more of a home than I've ever claimed. Boarding call. Don't watch me walk through security — I always cry at that part and I have a reputation."
    thought: "(Expression: tender. She walks away first, on her own terms, for once not because she has to. The departure gate swallows her and somehow it feels less like an ending than anything in her life has.)"
    visual:
      expression: tender
    is_end: true
    effects:
      flag_set:
        vq_ending_departed: true
      state_set:
        vq_arc: departed_open
        last_vq_encounter_at: NOW
      stat_set:
        vq_trust: 10

  # ============================================
  # ENDING 3: RUNWAY FRIENDS (honest, kind)
  # ============================================
  vq_end_friends_start:
    id: vq_end_friends_start
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "You know what I figured out somewhere over the Pacific? You never once tried to collect on the long version. You just... kept showing up for it. That's rarer than romance, guapo. I've had a hundred men want my nights. You're the only one who kept wanting my Tuesdays."
    thought: "(Expression: happy. Whatever spark there was has settled into something steadier — the kind of warmth that doesn't need a boarding pass to survive. She's smiling without any performance in it.)"
    visual:
      expression: happy
    choices:
      - id: friends_accept
        text: "'Tuesdays are underrated. Friends, then — the permanent manifest.'"
        next_node_id: vq_end_friends_resolved

  vq_end_friends_resolved:
    id: vq_end_friends_resolved
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "The permanent manifest. I'm stealing that for the contact name. ...Listen — if you ever fly, I'll get you the good seats. And if you ever need someone to tell you the truth from thirty thousand feet, I'm your woman. Friends don't ask each other to stay. They just keep coming back. See you at cruising altitude."
    thought: "(Expression: tender. She got the ending she knows how to survive — closeness without custody. It's honest, and it's kind, and for Valentina Quan that counts as a happy ending.)"
    visual:
      expression: tender
    is_end: true
    effects:
      flag_set:
        vq_ending_friendship: true
      state_set:
        vq_arc: friendship
        last_vq_encounter_at: NOW

  # ============================================
  # ENDING 4: SHUT OUT (pushed too hard)
  # ============================================
  vq_end_shutout_start:
    id: vq_end_shutout_start
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "You heard about the transfer, then. International routes. Tokyo base. Everyone's calling it a promotion. ...Let's not perform this, guapo. We both know which conversation did this."
    thought: "(Expression: cold. The warmth isn't gone — it's locked in the cargo hold. He pushed, and she built the exit she always promises herself, and this time she made it permanent on purpose.)"
    visual:
      expression: calculating
      position: right
      transition: fade
    choices:
      - id: shutout_apologize
        text: "'I pushed too hard. I know. I'd take it back if I could.'"
        next_node_id: vq_end_shutout_resolved

  vq_end_shutout_resolved:
    id: vq_end_shutout_resolved
    type: character
    speaker_id: 670eea6f-3983-4d5a-8195-b08be6c81661
    text: "I know you would. That's the sad part — you're a good man who said exactly the wrong sentence to exactly the wrong woman. Tokyo's thirteen hours ahead. I'll be fine. I'm always fine — that's the family specialty. ...Take care of yourself. Don't wait by any phones."
    thought: "(Expression: sad. She quotes her mother's line like a eulogy for what might have been. The long version exists now, but he'll never hear another chapter of it — she made sure of that at the roster desk.)"
    visual:
      expression: sad
    is_end: true
    effects:
      flag_set:
        vq_ending_shut_out: true
      state_set:
        vq_arc: shut_out
        last_vq_encounter_at: NOW
      stat_set:
        vq_trust: -10

metadata:
  version: "1.0"
  required_flags:
    vq_father_revealed: true
  tags:
    - "valentina_quan"
    - "act5"
    - "endings"
    - "grounded"
    - "departed"
    - "friendship"
    - "shut_out"
  notes: |
    Four endings, gated on the entry choices of this tree only (kept in one
    place for tuning):
    - GROUNDED (best): vq_gave_space AND vq_trust gte:40 AND NOT
      vq_pushed_away. She declines the transfer and tries staying.
    - SHUT OUT: vq_pushed_away. Final block; Tokyo transfer.
    - DEPARTURE GATE: vq_trust gte:15, hidden if pushed_away or gave_space
      (hidden_if is OR). Warm, open-ended romance in transit.
    - RUNWAY FRIENDS: default fallback (also reachable when gave_space is set
      but trust is below 40).
    Trust thresholds are playtest estimates per the plan's risk note.
