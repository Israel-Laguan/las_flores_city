    - "consequences"
  notes: |
    This dialogue implements Phase 5.1 of the Adeyemi relationship plan:
    - Late-game pressure point where player discovers damning information about Adeyemi
    - Three main action choices with different narrative and relationship consequences:
      1. Publish evidence - massive visibility, destroys relationship, leads to Opponent ending
      2. Hide evidence - private confrontation, preserves possibility of redemption, leads to various endings based on follow-up
      3. Destroy evidence - compromise position, complicated moral consequences
    - Each path leads to different final relationship states and possible Act 5 endings
    - The discovery moment is a major turning point that determines the final trajectory of the relationship
    - Key flags set here determine which Act 5 resolution scenes are available