    - Player has three main reaction choices with massively different outcomes:
      1. Confront Adeyemi privately - increases Tension and Familiarity, moderate Trust impact
      2. Publicly denounce Adeyemi - massive negative impact on Trust and Alignment, but high Familiarity
      3. Ignore the situation - smaller impacts but missed opportunity
