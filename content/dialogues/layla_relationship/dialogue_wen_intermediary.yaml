id: d75f1a08-935b-4fa1-a584-df79629df66b
name: "Wen - Intermediary for Layla"
description: "Wen Zhao acts as Layla's intermediary: she messages/meets the player to relay Layla's feelings, vouch for her, and push the player to be bolder and more decisive with Layla, who is too sheltered to ask for what she wants. Unbeknownst to Wen, Layla sometimes uses these interactions to make Wen jealous, creating a subtle tension beneath the surface."
character_id: d1fc0275-af55-4fe0-8fc2-a36c42c264ae
dialogue_scope: character
start_node_id: wen_intermediary_start
nodes:
  wen_intermediary_start:
    id: wen_intermediary_start
    type: character
    speaker_id: d1fc0275-af55-4fe0-8fc2-a36c42c264ae
    text: "Hey, R. It's Wen. Layla's freaking out again — she won't text you because she thinks she's 'too much,' which, trust me, she is, but that's the point. So I'm texting for her. Don't be weird about it. ...She's weirdly calm about it today, actually. Almost... smug?"
    thought: "Wen enjoys this — being the emissary, the one who knows the boy and the girl and stands between. She's playing matchmaker and strategist at once. She doesn't notice the flicker of something beneath Layla's usual panic — a satisfaction, maybe, that she's got someone Wen doesn't control completely."
    visual:
      expression: smirk
      position: right
      transition: fade
    effects:
      flag_set:
        wen_intermediary_contact: true
    choices:
      - id: wen_ask
        text: "What does she want me to do?"
        next_node_id: wen_relay
        time_block_cost:
          amount: 1
          description: "Talking with Wen about Layla"
      - id: wen_curt
        text: "Tell her to text me herself."
        next_node_id: wen_defend
        time_block_cost:
          amount: 1
          description: "Talking with Wen about Layla"

  wen_relay:
    id: wen_relay
    type: character
    speaker_id: d1fc0275-af55-4fe0-8fc2-a36c42c264ae
    text: "She wants you to be bolder. She won't say it — she read about 'confident women' in books and now she's waiting for you to be the movie. So be the movie. Pick the place, text her first, don't make her chase. She's never been chased, R."
    thought: "Wen is translating Layla's helplessness into instructions. She's half genuinely helping, half living the romance through her friend because her own is colder."
    choices:
      - id: wen_agree_bold
        text: "I can do that. Tell her I'll text first."
        next_node_id: wen_deal
        effects:
          relationship_effect:
            target_character_id: d9927cf6-cc6c-42d3-b39c-023e6252b453
            axes:
              trust: 6
              familiarity: 4
              alignment: 6
          state_set:
            last_layla_encounter_at: NOW
      - id: wen_question
        text: "Why doesn't she just ask for what she wants?"
        next_node_id: wen_explain
        effects:
          relationship_effect:
            target_character_id: d9927cf6-cc6c-42d3-b39c-023e6252b453
            axes:
              familiarity: 3
          state_set:
            last_layla_encounter_at: NOW

  wen_defend:
    id: wen_defend
    type: character
    speaker_id: d1fc0275-af55-4fe0-8fc2-a36c42c264ae
    text: "She would if she could. You don't get it — at home she's the perfect daughter, she's never wanted anything for herself out loud. So someone has to want for her first. Usually that's me. Today it's you. Step up."
    thought: "Wen's sharpness softens for a second — she knows exactly how trapped Layla is, because she's trapped the same way. The insistence is protective, not just nosy."
    choices:
      - id: wen_relent
        text: "Okay. I'll reach out to her."
        next_node_id: wen_deal
        effects:
          relationship_effect:
            target_character_id: d9927cf6-cc6c-42d3-b39c-023e6252b453
            axes:
              trust: 8
              familiarity: 4
          state_set:
            last_layla_encounter_at: NOW
      - id: wen_push_back
        text: "She should learn to ask. I'm not her dad."
        next_node_id: wen_warn
        effects:
          relationship_effect:
            target_character_id: d9927cf6-cc6c-42d3-b39c-023e6252b453
            axes:
              tension: 8
              alignment: -4
          state_set:
            last_layla_encounter_at: NOW

  wen_explain:
    id: wen_explain
    type: character
    speaker_id: d1fc0275-af55-4fe0-8fc2-a36c42c264ae
    text: "Because she doesn't know how. Her mom decided everything — school, clothes, who she talks to. Layla's first 'want' was you, and she's terrified of wanting wrong. So go easy, but go. She needs the bold part from you."
    thought: "This is the closest Wen comes to admitting her own fear. She ships Layla toward the freedom she's not sure she can claim for herself."
    choices:
      - id: wen_understand
        text: "That makes sense. I'll be the bold one."
        next_node_id: wen_deal
        effects:
          relationship_effect:
            target_character_id: d9927cf6-cc6c-42d3-b39c-023e6252b453
            axes:
              trust: 10
              familiarity: 5
              alignment: 8
          state_set:
            last_layla_encounter_at: NOW

  wen_deal:
    id: wen_deal
    type: character
    speaker_id: d1fc0275-af55-4fe0-8fc2-a36c42c264ae
    text: "Good. I'll tell her you texted. She'll act surprised, like she didn't pray for it last night. Keep it clean though — R only, no voice, delete after. I taught her the rules, don't make me look stupid."
    thought: "Wen closes the deal like a handler. She's invested now; Layla's secret is her secret too."
    visual:
      expression: smirk
      position: right
    is_end: true
    effects:
      flag_set:
        wen_intermediary_brokered: true
        layla_wen_intermediary_used: true
      state_set:
        last_layla_encounter_at: NOW
        last_wen_encounter_at: NOW
      relationship_effect:
        target_character_id: d9927cf6-cc6c-42d3-b39c-023e6252b453
        axes:
          alignment: 5

  wen_warn:
    id: wen_warn
    type: character
    speaker_id: d1fc0275-af55-4fe0-8fc2-a36c42c264ae
    text: "No. You're not. But if you bail, she'll go quiet for weeks and blame herself, not you. That's how she's built. Your call, R. Just know the cost isn't yours, it's hers."
    thought: "Wen respects the pushback but won't soften the consequence. She's warning him the way an older sister warns a careless boy about her sibling."
    visual:
      expression: calculating
      position: right
    is_end: true
    effects:
      flag_set:
        wen_intermediary_warned: true
      state_set:
        last_wen_encounter_at: NOW
      relationship_effect:
        target_character_id: d9927cf6-cc6c-42d3-b39c-023e6252b453
        axes:
          tension: 6

