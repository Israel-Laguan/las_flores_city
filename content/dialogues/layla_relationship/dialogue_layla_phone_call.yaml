    - "secrecy"
    - "photos"
    - "gate_logic"
    - "accent"
  notes: |
    Only accessible after Act 1 first contact (layla_first_contact_made).
    Establishes the secrecy rules: label R, text only at home, no voice,
    photos only behind a locked door or in a safe batch with Wen.
