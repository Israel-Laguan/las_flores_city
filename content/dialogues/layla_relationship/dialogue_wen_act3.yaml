    Act 3 contains all five endings for Wen Zhao's arc.
    Gate logic summary:
      wen_post_intimate_honest + wen_manipulation_confronted → 💖 Lover
      wen_manipulation_confronted + NOT wen_intimate_scene → 🤝 Friend
      wen_intimate_scene + wen_post_intimate_cool → 💔 Tragic (default fallback)
      layla_ending_lovers + wen_layla_manipulation_seed → 🔥 Enemy (separate entry branch)
      wen_dare_refused + NOT wen_first_kiss → 🌫️ Distant (separate entry branch)

    Side effect of Enemy ending: layla_community_tipped is set,
    which should be readable by Layla's dialogue tree to surface
    the fallout with her father in a follow-on scene.
