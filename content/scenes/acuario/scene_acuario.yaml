  idle_thoughts:
    - The holographic reef tunnel loops every 18 minutes. The same digital fish swim the same paths, day after day. The resolution is high, but visitors who stop moving notice the repetition and glitches.
    - An LW Group sponsor plaque is mounted at 1.2-metre intervals along the path. The entity that contaminated the delta is the primary sponsor of this eco-nature experience.
    - Biometric scan at entry: logged. The terms-of-service addendum routes this data to LW Group's security division. A final scan at exit completes the tracking loop.
    - The touch pool station is mandatory. Everyone must pass through it. The engineered sea stars and hermit crabs have been selected for their ability to withstand constant handling.
    - Coral Café sits at the exit approach. There is no bypass. The fish sticks are textured soy protein, the shrimp is mushroom derivative, the ocean water lemonade is a bright blue sports drink.
    - The exit is through Conservation Keepers gift shop. There is no other way out. The path snakes through display tables, past the registers, and only then to the door.
    - The parking lot equals the building's footprint. Electric shuttle carts ferry visitors from the far rows, their announcements extolling the aquarium's commitment to reducing carbon emissions.
