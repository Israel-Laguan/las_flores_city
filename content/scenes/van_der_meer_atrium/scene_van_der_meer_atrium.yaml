  idle_thoughts:
    - Real soil, real trees, and a humidity setting nobody on the ground floor can afford. The garden is the family's idea of a public gesture. It is closed to the public.
    - A table near the terrace is stacked with flyers for Amor Verdadero. Someone has hand-drawn a small rainbow on each corner. The handwriting is young and in a hurry.
    - The security staff stand at the lift without ever looking bored. They are not guarding the building so much as one specific teenager.
