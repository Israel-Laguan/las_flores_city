name: Van der Meer Tower — Sky Atrium
description: A glass-roofed garden atrium on the upper floors of the Van der Meer tower, kept private for family events and the Amor Verdadero youth salon. A greeter and two quiet security staff screen anyone who comes up the private lift. Real soil, real trees and a long table of rainbow-ribboned flyers sit under a skyline the lower districts rarely see.
