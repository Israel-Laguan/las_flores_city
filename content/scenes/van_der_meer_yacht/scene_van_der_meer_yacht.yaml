name: Van der Meer Yacht — Sundeck
description: The sundeck of a Van der Meer family yacht moored off the Port, hired out most weekends for Peter Jr.'s "Amor Verdadero Sunset Socials". Ring lights, a hired photographer, a speaker rig and a crowd of well-dressed teenagers and twenty-somethings who all seem to know exactly where the cameras are. The pin on his collar is always in frame.
