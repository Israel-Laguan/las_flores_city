  idle_thoughts:
    - Every guest on this deck knows where the cameras are. Almost nobody looks at them directly, which is how you can tell they are posing.
    - The rainbow pin is visible in nearly every photograph taken today. Its position on the collar does not change between photographs.
    - The stern rail is the only part of the deck without a ring light. A figure stands there alone for a moment between shots, looking at a phone.
